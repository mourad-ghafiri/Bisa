# cargo-nextest for the shell's own workspace. nextest reads `.config/nextest.toml`
# from the workspace it runs, and this one is apart from the repository's
# (`../../.config/nextest.toml`), whose overrides name packages that are not
# here. The same rules, without the journeys: nothing retries, and the
# `coverage` profile `scripts/coverage/measure` asks for (`-P coverage`)
# doubles the window for instrumented binaries.
# (https://nexte.st/docs/configuration/#profiles)
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.coverage]
slow-timeout = { period = "60s", terminate-after = 4 }
