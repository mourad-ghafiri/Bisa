# cargo-deny: "no copyleft, no licence nobody has read" as a build failure, not
# a promise (docs/contributing/release.md §Licence). `just licence-gate` runs it
# on both workspaces when cargo-deny is installed, and `scripts/licences/
# check-licences.mjs` judges the same graphs against this very list on a machine
# without it; CI always runs both. This list is **the** allow list: the desktop
# shell's `deny.toml` is a copy a test holds equal, and the third-party notices
# are rendered from the same rules.
#
# Every id here is permissive for a work distributed under MIT, with three that
# deserve a word:
# - MPL-2.0 — file-level copyleft. Two unmodified crates from crates.io carry it
#   (attohttpc, option-ext); the notices point at their source, as §3.2 asks.
# - CDLA-Permissive-2.0 — the data licence of the Mozilla CA list webpki-roots
#   embeds; attribution only.
# - BSL-1.0 — ryu's alternative to Apache-2.0, and two Windows-only crates
#   (clipboard-win, error-code); attribution only.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
# One list serves two workspaces, and each carries an id the other does not
# (0BSD is the shell's, CDLA-Permissive-2.0 the node's): an allowance one graph
# never meets is no fault of that graph.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
# A vulnerability or an unsound advisory fails the check whatever its depth;
# a yanked version is said and should be moved off at the next update.
yanked = "warn"
# An unmaintained crate is ours to replace when we depend on it directly; one
# deep in a framework's tree (a Linux D-Bus binding under a Tauri plugin, a
# `paste` behind a macro crate) is its owner's to move, and said here would
# only hide the advisories that are ours.
unmaintained = "workspace"
# The RustSec database is cloned inside the tree, never under `$CARGO_HOME`:
# the tree's own tools live under `target/tools`, and so does what they fetch.
db-path = "target/advisory-db"
# One list serves two workspaces, and an ignore one graph never meets is no
# fault of that graph (the shell's tree has no test relay).
unused-ignored-advisory = "allow"
ignore = [
    # The scripted relay the collaboration tests run against: a dev-dependency
    # of four crates and nothing that ships; the wire crates are nostr-sdk's,
    # which is maintained. A maintained test relay — or one of our own over
    # the same wire crates — is the follow-up that lifts this.
    { id = "RUSTSEC-2026-0237", reason = "nostr-relay-builder is a test relay, a dev-dependency only; the wire crates are nostr-sdk's" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
