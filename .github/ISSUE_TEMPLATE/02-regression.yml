name: "Regression"
description: "Something that worked in an earlier release no longer does."
title: "[Regression]: "
labels: ["kind: regression", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A regression is fixed before new work. Tell us the last release where it worked.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Bisa? The area guides are in docs/contributing/areas/.
      multiple: false
      options:
        - "Inbox"
        - "Agents & teams"
        - "Projects"
        - "Project IDE (editor, search, git, terminals, pull requests, browser, Mobile Development, language servers, Board)"
        - "Workflows & events"
        - "Goals"
        - "Pulse"
        - "Channels, DMs & conversations"
        - "Settings"
        - "Collaboration"
        - "Connectors"
        - "Notes"
        - "Drawing"
        - "Pets"
        - "Addons"
        - "Decision-making"
        - "Security features"
        - "Harnesses"
        - "CLI"
        - "Node & HTTP API"
        - "MCP tools"
        - "Workspace & storage"
        - "Core"
        - "Desktop app"
        - "Mobile app (planned)"
        - "Website"
        - "Translation"
        - "Catalog"
        - "Docs"
        - "Build & release"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: worked
    attributes:
      label: "Last release where it worked"
      description: "For example 0.1.0."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bisa version
      description: From About in the app, or `bisa --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "macOS \u2014 Apple Silicon"
        - "macOS \u2014 Intel"
        - "Linux (built from source)"
        - "Windows (built from source)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What changed"
      description: "What worked before, and what happens now."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "The smallest steps that show it."
      placeholder: "1. \u2026\n2. \u2026"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Relevant lines from `bisa logs`, with anything that is yours alone removed."
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: "I searched the open and closed issues and the Discussions, and this is not a duplicate."
          required: true
        - label: "I removed keys, tokens, personal paths, e-mail addresses and anything else that is mine alone from what I pasted."
          required: true
        - label: "This is not a security vulnerability \u2014 those are reported privately, as SECURITY.md says."
          required: true
        - label: "I follow the Code of Conduct."
          required: true
