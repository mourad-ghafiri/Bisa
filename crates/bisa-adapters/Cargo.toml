[package]
name = "bisa-adapters"
description = "Concrete harness adapters: claude-code, codex, acp, pi-rpc, omp, opencode, copilot, grok, custom-json"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = [
    "claude-code",
    "codex",
    "acp",
    "pi-rpc",
    "omp",
    "opencode",
    "copilot",
    "grok",
    "custom-json",
]
claude-code = []
codex = []
acp = []
pi-rpc = []
# The omp adapter layers RPC-v2 framing on the pi wire protocol.
omp = ["pi-rpc"]
opencode = []
# GitHub Copilot CLI and Grok Build speak ACP: each adapter is its harness's
# facts over the one protocol module.
copilot = ["acp"]
grok = ["acp"]
custom-json = []
# A2A consume side (remote Agent2Agent workers); off by default.
a2a = ["dep:ulid"]

[dependencies]
bisa-core = { workspace = true }
bisa-harness = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
base64 = { workspace = true }
bisa-http = { workspace = true }
ulid = { workspace = true, optional = true }
bisa-deps = { version = "0.2", path = "../bisa-deps" }

[dev-dependencies]
tempfile = { workspace = true }
bisa-harness = { workspace = true, features = ["mock"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
