[package]
name = "bisa-collab"
description = "The collaboration protocol between a host node and the humans it hosts: gift-wrapped events, control messages, invite codes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
bisa-core = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
nostr-sdk = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
# The wire's one TLS backend, installed as the process default (`tls.rs`): the
# websocket stack under `nostr-sdk` uses the process-wide provider, and with
# both of rustls' backends compiled into this workspace it has none until told.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bisa-deps = { version = "0.1", path = "../bisa-deps" }

[dev-dependencies]
nostr-relay-builder = { workspace = true }

[lints]
workspace = true
