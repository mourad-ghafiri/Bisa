[package]
name = "bisa-ssh"
description = "SSH for git hosts: keys, ssh-agent, the ssh_config Host blocks and one authentication handshake — argv-only, public material only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# A leaf like bisa-vcs: synchronous, workspace-dep-free. It knows the
# OpenSSH programs and nothing about the workspace; the engine drives it from
# spawn_blocking. It never opens a private key — `*.pub`, `ssh -G`, the
# agent's list and `ssh_config` are all it reads.
[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
bisa-deps = { version = "0.3", path = "../bisa-deps" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
