[package]
name = "bisa-codehost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pull requests, checks, reviews and merges behind one CodeHost trait"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# The one place a client is built; the engine hands in its handle.
bisa-http = { workspace = true }
keyring = { workspace = true }
tracing = { workspace = true }
# The code host CLIs (`gh`, `glab`) are asked first: `which` says whether one
# is on PATH, tokio moves the spawn off the async runtime.
which = { workspace = true }
tokio = { workspace = true }
bisa-deps = { version = "0.1", path = "../bisa-deps" }

[dev-dependencies]
tempfile = "3"
# The API implementations are tested against a stub HTTP server on the
# loopback interface — canned answers, recorded requests, no network — and
# the CLI implementations against `cli::fake::FakeCli`, no program spawned.
axum = { workspace = true }

[lints]
workspace = true
