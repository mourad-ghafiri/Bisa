[package]
name = "bisa-net"
description = "The host's pump: what a workspace says to the people it hosts on other nodes, over relays and direct QUIC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
bisa-core = { workspace = true }
bisa-collab = { workspace = true }
bisa-store = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { version = "0.9", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
secp256k1 = { workspace = true, optional = true }
bisa-deps = { version = "0.3", path = "../bisa-deps" }

[features]
default = []
## Direct QUIC transport (see `iroh_sync`). Local-only by default: iroh's
## public relay/discovery infrastructure stays disabled unless the
## `sync.iroh.n0_relays` setting is on.
iroh = ["dep:iroh", "dep:rand", "dep:rustls", "dep:secp256k1", "dep:sha2", "dep:hex", "dep:base64"]

[dev-dependencies]
bisa-guest = { workspace = true }
nostr-relay-builder = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
