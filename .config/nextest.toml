# cargo-nextest, when installed under target/tools (Justfile `install-nextest`).
# One process pool for every binary's tests; a test that outstays its window is
# ended rather than left holding the run. A flake is a bug — nothing retries.
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# The journeys (`crates/bisa-cli/tests/it/e2e/`) each start a daemon and the
# agents it launches: a few at a time, and with a longer window — a journey
# waits on a process, where a unit test waits on a function.
# (https://nexte.st/docs/configuration/test-groups/,
# https://nexte.st/docs/configuration/per-test-overrides/)
[test-groups]
journeys = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(bisa-cli) & test(/^e2e::/)'
test-group = 'journeys'
slow-timeout = { period = "60s", terminate-after = 4 }
