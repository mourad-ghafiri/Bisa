<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bug hunt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="work" data-tool="swatter">
  <main id="glass" class="glass" aria-label="Bug hunt">
    <div id="bugs" class="bugs" aria-hidden="true"></div>
    <svg id="marks" class="marks" aria-hidden="true"></svg>
    <div id="fx" class="fx" aria-hidden="true"></div>
    <svg id="trail" class="trail" aria-hidden="true"></svg>
    <div id="hand" class="hand" data-tool="swatter" hidden aria-hidden="true"><span class="shadow"></span><svg viewBox="0 0 128 128"><use id="handUse" href="#x-swatter"></use></svg></div>
  </main>
  <nav id="strip" class="strip" aria-label="Bug hunt tools">
    <div class="hud">
      <output id="score" class="score" aria-label="Score">0</output>
      <span id="streak" class="streak" aria-live="polite"></span>
      <span id="best" class="best">best 0</span>
    </div>
    <div class="tools" role="group" aria-label="Tools">
      <button class="tool" type="button" data-tool="whip" aria-label="Whip" title="Whip — the tip is your pointer; click to crack it there" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-whip"></use></svg></button>
      <button class="tool" type="button" data-tool="swatter" aria-label="Flyswatter" title="Flyswatter — click to swat" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-swatter"></use></svg></button>
      <button class="tool" type="button" data-tool="slipper" aria-label="Slipper" title="Slipper — click to slap" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-slipper"></use></svg></button>
      <button class="tool" type="button" data-tool="newspaper" aria-label="Newspaper" title="Newspaper — click to whack, it follows your swing" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-newspaper"></use></svg></button>
      <button class="tool" type="button" data-tool="spray" aria-label="Spray" title="Spray — click to spray the way you moved" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-spray"></use></svg></button>
      <button class="tool" type="button" data-tool="squeegee" aria-label="Squeegee" title="Squeegee — drag to wipe the glass" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-squeegee"></use></svg></button>
    </div>
    <button id="mode" class="switch" type="button" aria-pressed="false" title="Hunt (Esc returns to work)">Hunt</button>
    <div class="foot">
      <p id="wait" class="wait" aria-live="polite"></p>
      <button id="difficulty" class="pace" type="button" title="How many come: calm, busy or a swarm"><span class="pace-label">Pace</span><span id="paceValue" class="pace-value">Busy</span></button>
      <button id="marksBtn" class="icon" type="button" aria-label="Glass marks: off — a miss leaves no crack" aria-pressed="false" title="Glass marks: off — a miss leaves no crack (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-marks"></use></svg></button>
      <button id="mute" class="icon" type="button" aria-label="Mute" aria-pressed="false" title="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><use id="muteIcon" href="#t-sound"></use></svg></button>
      <button id="leave" class="icon" type="button" aria-label="Leave the scene" title="Leave the scene"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#t-leave"></use></svg></button>
    </div>
  </nav>
  <svg class="sheet" aria-hidden="true" focusable="false">

      <linearGradient id="g-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efdc"/><stop offset="0.5" stop-color="#e9dfc6"/><stop offset="1" stop-color="#cfc3a6"/></linearGradient>
      <linearGradient id="g-grip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4a24"/><stop offset="0.5" stop-color="#4e2c12"/><stop offset="1" stop-color="#2c1808"/></linearGradient>
