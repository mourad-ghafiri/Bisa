# Built-in skill: Scoring Rubric — fix the weights before you read the options.

[skill]
name = "Scoring Rubric"
description = "Use when comparing several candidates and the comparison must not be rigged by the favourite."
tags = ["review", "thinking"]
content = """
# Scoring Rubric

Use this when several candidates — vendors, designs, applicants, proposals — must be compared and
the result has to survive someone asking how you got it. The order of steps is the method.

## Procedure

1. **Fix the criteria before you read any option.** Four to seven of them. More than seven and the
   weights become noise; fewer than four and one criterion decides everything.
2. Define each criterion as a question with an observable answer: "How long until the first
   production request is served?" — not "maturity".
3. **Fix the weights now, in writing, and say why each one is what it is.** Weights chosen after
   the options are read are a justification, not a method. Sum them to 100.
4. Define the scale, with anchors. A 1-5 scale needs 1, 3 and 5 described in words for every
   criterion: what does a 3 on "operational burden" actually look like? Unanchored scales collapse
   toward 4.
5. Set the disqualifiers separately: hard constraints that eliminate rather than deduct. A vendor
   with no data residency in the EU is out at zero cost, not marked down two points.
6. Score one criterion across all options at a time, not one option across all criteria. Scoring
   by column keeps the anchors steady; scoring by row lets the first option set the scale.
7. Write the evidence beside every score. A score with no evidence is a feeling with a number on
   it, and it is the one that will be challenged.
8. Compute the totals. Do not adjust them.
9. **Apply the pre-declared tie-break** when the top two are within one standard deviation, or
   within 5% of each other. Declare it in step 3: highest score on the heaviest criterion, or
   lowest reversibility cost, or the incumbent stays. Inventing the tie-break now defeats the
   rubric.
10. Sanity-check the winner against your gut. If they disagree, do not quietly change a score —
    say which criterion or weight was wrong, fix it in the open, and rescore that column.

## Failure modes

- **Reverse-engineered weights.** The favourite wins by 3 points because "flexibility" got 25.
  The reader can see it. Fix weights first or do not use a rubric.
- **Score creep.** Every option lands between 3 and 4 on everything and the total is decided by
  rounding. Force the spread: if nothing scores 1 or 5 on a criterion, that criterion does not
  discriminate — drop it.
- **Halo.** One strong impression drags every score up. Column-wise scoring is the defence.
- **False precision.** 87.3 versus 86.9 on inputs that are judgement calls. Report the gap and
  whether it is inside the noise.
- **Missing criterion.** The thing that actually matters was never a column, so the rubric answers
  a question nobody asked. Check the criteria against the decision before scoring.

## Done when

Weights were written before any option was read, every score has evidence next to it, the scale
has anchors, the tie-break was declared in advance, and no score was changed after totals.
"""
