# Built-in connector: Pipedrive — deals, people and organizations in a sales pipeline.
#
# The API token goes in the `x-api-token` header, and calls go to the
# company's own domain, which Pipedrive advises "for faster requests" — so
# the account names it. Deals, persons, organizations and search are the
# v2 API, which takes JSON only and answers a list under `data`, 100
# unless `limit` says otherwise (500 at most; 100 for search); the current
# user and notes are v1. A person's emails are a list of objects, not
# text. A note names at least one of the deal, the person or the
# organization it is about. Search wants two characters or more.
#
# Reference: https://pipedrive.readme.io/docs/core-api-concepts-authentication
# Reference: https://pipedrive.readme.io/docs/how-to-find-the-api-token
# Reference: https://pipedrive.readme.io/docs/core-api-concepts-requests
# Reference: https://pipedrive.readme.io/docs/pipedrive-api-v2
# Reference: https://pipedrive.readme.io/docs/core-api-concepts-rate-limiting
# Reference: https://developers.pipedrive.com/docs/api/v1/Users
# Reference: https://developers.pipedrive.com/docs/api/v1/Deals
# Reference: https://developers.pipedrive.com/docs/api/v1/Persons
# Reference: https://developers.pipedrive.com/docs/api/v1/Organizations
# Reference: https://developers.pipedrive.com/docs/api/v1/ItemSearch
# Reference: https://developers.pipedrive.com/docs/api/v1/Notes

[connector]
name = "Pipedrive"
description = "List and search deals, people and organizations, add or update a deal, add a person, an organization or a note. Paste your API token; the account names your company's Pipedrive domain."
tags = ["business", "management"]
base_url = "https://{account.company}.pipedrive.com"
hosts = ["*.pipedrive.com"]
check = "me"
revision = 1

[connector.auth]
scheme = "api_key"
place = { in = "header", name = "x-api-token" }

[[connector.params]]
name = "company"
label = "Company domain"
required = true
doc = "The first part of your Pipedrive address: acme for acme.pipedrive.com."

[[connector.operations]]
id = "me"
name = "Me"
description = "The token's user and their company — the one call that proves the account works."
method = "get"
path = "/api/v1/users/me"

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "list_deals"
name = "List deals"
description = "Deals that are not archived."
method = "get"
path = "/api/v2/deals"
query = { status = "{params.status}", limit = "{params.max}" }

[[connector.operations.params]]
name = "status"
label = "Status"
doc = "open, won, lost or deleted; empty for every one."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many deals to return, 500 at most; Pipedrive's default is 100."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "get_deal"
name = "Get deal"
description = "One deal."
method = "get"
path = "/api/v2/deals/{params.id}"

[[connector.operations.params]]
name = "id"
label = "Deal id"
kind = "number"
required = true
doc = "The deal's number."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "create_deal"
name = "Add deal"
description = "Add a deal, optionally for a person or an organization."
method = "post"
path = "/api/v2/deals"
body = { kind = "json", value = { title = "{params.title}", value = "{params.value}", currency = "{params.currency}", person_id = "{params.person}", org_id = "{params.organization}" } }
writes = true

[[connector.operations.params]]
name = "title"
label = "Title"
required = true
doc = "The deal's title."

[[connector.operations.params]]
name = "value"
label = "Value"
kind = "number"
doc = "What the deal is worth; empty for none."

[[connector.operations.params]]
name = "currency"
label = "Currency"
doc = "The value's currency code, USD; empty for the company's default."

[[connector.operations.params]]
name = "person"
label = "Person id"
kind = "number"
doc = "The person the deal is with; empty for none."

[[connector.operations.params]]
name = "organization"
label = "Organization id"
kind = "number"
doc = "The organization the deal is with; empty for none."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "update_deal"
name = "Update deal"
description = "Change a deal's title, value, status or stage; what is left empty stays as it is."
method = "patch"
path = "/api/v2/deals/{params.id}"
body = { kind = "json", value = { title = "{params.title}", value = "{params.value}", status = "{params.status}", stage_id = "{params.stage}" } }
writes = true

[[connector.operations.params]]
name = "id"
label = "Deal id"
kind = "number"
required = true
doc = "The deal's number."

[[connector.operations.params]]
name = "title"
label = "Title"
doc = "The new title; empty to keep it."

[[connector.operations.params]]
name = "value"
label = "Value"
kind = "number"
doc = "The new value; empty to keep it."

[[connector.operations.params]]
name = "status"
label = "Status"
doc = "open, won or lost; empty to keep it."

[[connector.operations.params]]
name = "stage"
label = "Stage id"
kind = "number"
doc = "The pipeline stage to move the deal to; empty to keep it."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "list_persons"
name = "List people"
description = "The people in the company's contacts."
method = "get"
path = "/api/v2/persons"
query = { limit = "{params.max}" }

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many people to return, 500 at most; Pipedrive's default is 100."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "create_person"
name = "Add person"
description = "Add a person, optionally with their email addresses and their organization."
method = "post"
path = "/api/v2/persons"
body = { kind = "json", value = { name = "{params.name}", emails = "{params.emails}", org_id = "{params.organization}" } }
writes = true

[[connector.operations.params]]
name = "name"
label = "Name"
required = true
doc = "The person's name."

[[connector.operations.params]]
name = "emails"
label = "Emails"
kind = "json"
doc = "A JSON array of addresses: [{\"value\": \"ada@example.com\", \"primary\": true}]. Empty for none."

[[connector.operations.params]]
name = "organization"
label = "Organization id"
kind = "number"
doc = "The organization the person belongs to; empty for none."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "list_organizations"
name = "List organizations"
description = "The organizations in the company's contacts."
method = "get"
path = "/api/v2/organizations"
query = { limit = "{params.max}" }

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many organizations to return, 500 at most; Pipedrive's default is 100."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "create_organization"
name = "Add organization"
description = "Add an organization by its name."
method = "post"
path = "/api/v2/organizations"
body = { kind = "json", value = { name = "{params.name}" } }
writes = true

[[connector.operations.params]]
name = "name"
label = "Name"
required = true
doc = "The organization's name."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "search"
name = "Search"
description = "Deals, people, organizations and more whose fields match a term."
method = "get"
path = "/api/v2/itemSearch"
query = { term = "{params.term}", item_types = "{params.types}", limit = "{params.max}" }

[[connector.operations.params]]
name = "term"
label = "Term"
required = true
doc = "What to look for, two characters or more."

[[connector.operations.params]]
name = "types"
label = "Item types"
doc = "Comma-separated: deal,person,organization,product,lead,file,mail_attachment,project. Empty for all."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many matches to return; 100 is the default and the most."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "add_note"
name = "Add note"
description = "Add a note to a deal, a person or an organization."
method = "post"
path = "/api/v1/notes"
body = { kind = "json", value = { content = "{params.content}", deal_id = "{params.deal}", person_id = "{params.person}", org_id = "{params.organization}" } }
writes = true

[[connector.operations.params]]
name = "content"
label = "Note"
required = true
doc = "The note, in HTML."

[[connector.operations.params]]
name = "deal"
label = "Deal id"
kind = "number"
doc = "The deal the note is about. One of deal, person, organization is needed."

[[connector.operations.params]]
name = "person"
label = "Person id"
kind = "number"
doc = "The person the note is about."

[[connector.operations.params]]
name = "organization"
label = "Organization id"
kind = "number"
doc = "The organization the note is about."

[connector.operations.output]
select = "data"
