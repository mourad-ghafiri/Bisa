# Built-in connector: Instagram — a professional account's media over the Instagram API with Facebook Login.
#
# The Facebook Login flavour of the Instagram API: `graph.facebook.com`, a
# User or Page access token with the `instagram_basic` and
# `instagram_content_publish` permissions, the account's id from
# `GET /me/accounts?fields=instagram_business_account`. (The Instagram Login
# flavour lives on `graph.instagram.com` under other permission names and
# is another connector.) Every path names the Graph API version it was
# written against (v26.0). Publishing is two calls: a container, then its
# publication; a container lives 24 hours.
#
# Reference: https://developers.facebook.com/docs/instagram-platform/instagram-api-with-facebook-login/get-started
# Reference: https://developers.facebook.com/docs/instagram-platform/content-publishing
# Reference: https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-user/media
# Reference: https://developers.facebook.com/docs/graph-api/guides/versioning
# Reference: https://developers.facebook.com/docs/graph-api/guides/error-handling

[connector]
name = "Instagram"
description = "List a professional account's media and publish an image in two calls: create a container, then publish it. Paste a long-lived access token with the instagram_basic and instagram_content_publish permissions."
tags = ["marketing", "content"]
base_url = "https://graph.facebook.com"
hosts = ["graph.facebook.com"]
check = "me"
revision = 1

[connector.auth]
scheme = "bearer"

[[connector.operations]]
id = "me"
name = "Me"
description = "What the token identifies — the one call that proves it works."
method = "get"
path = "/v26.0/me"
query = { fields = "id,name" }

[[connector.operations]]
id = "media"
name = "Media"
description = "The account's media, newest first."
method = "get"
path = "/v26.0/{params.user}/media"
query = { fields = "id,caption,media_type,media_url,permalink,timestamp", limit = "{params.max}" }

[[connector.operations.params]]
name = "user"
label = "Instagram user id"
required = true
doc = "The professional account's id, not its handle."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many items to return; the Graph API answers 25 unless told otherwise."

[connector.operations.output]
select = "data"

[[connector.operations]]
id = "create_media"
name = "Create media container"
description = "Stage an image for publishing; answers the container id publish_media needs."
method = "post"
path = "/v26.0/{params.user}/media"
body = { kind = "json", value = { image_url = "{params.image_url}", caption = "{params.caption}" } }
writes = true

[[connector.operations.params]]
name = "user"
label = "Instagram user id"
required = true
doc = "The professional account id, not its handle."

[[connector.operations.params]]
name = "image_url"
label = "Image URL"
required = true
doc = "A public https URL of a JPEG."

[[connector.operations.params]]
name = "caption"
label = "Caption"
doc = "The caption under the image; empty for none."

[[connector.operations]]
id = "publish_media"
name = "Publish media"
description = "Publish a staged container."
method = "post"
path = "/v26.0/{params.user}/media_publish"
body = { kind = "json", value = { creation_id = "{params.creation_id}" } }
writes = true

[[connector.operations.params]]
name = "user"
label = "Instagram user id"
required = true
doc = "The professional account id, not its handle."

[[connector.operations.params]]
name = "creation_id"
label = "Container id"
required = true
doc = "The id create_media answered."
