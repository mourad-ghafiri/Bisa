# Built-in connector: TikTok — the connected creator's profile and videos over the TikTok API.

[connector]
name = "TikTok"
description = "Read the connected creator's profile and video list. Connect with your own TikTok developer app (OAuth 2.0 with PKCE) with the user.info.basic and video.list scopes."
tags = ["marketing", "content"]
base_url = "https://open.tiktokapis.com"
hosts = ["open.tiktokapis.com"]
check = "user_info"

[connector.auth]
scheme = "oauth2"
authorization_url = "https://www.tiktok.com/v2/auth/authorize/"
token_url = "https://open.tiktokapis.com/v2/oauth/token/"
scopes = ["user.info.basic", "video.list"]
pkce = true

[[connector.operations]]
id = "user_info"
name = "User info"
description = "The connected creator's display name, avatar and counts — the one call that proves the account works."
method = "get"
path = "/v2/user/info/"
query = { fields = "open_id,display_name,avatar_url,follower_count,video_count" }

[connector.operations.output]
select = "data.user"

[[connector.operations]]
id = "video_list"
name = "Video list"
description = "The creator's latest videos."
method = "post"
path = "/v2/video/list/"
query = { fields = "id,title,create_time,share_url,view_count,like_count" }
body = { kind = "json", value = { max_count = "{params.max}" } }

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
required = true
doc = "Between 1 and 20."

[connector.operations.output]
select = "data.videos"
