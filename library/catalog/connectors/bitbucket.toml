# Built-in connector: Bitbucket — repositories and pull requests on Bitbucket Cloud over REST API 2.0.
#
# Sign in with the Atlassian account's email and an API token — the long-term
# replacement for app passwords — sent as HTTP Basic; the token needs the
# scopes of what it reads (repositories, pull requests). A list answers a
# page under `values`; these operations declare no page-size parameter, so
# each reads the page Bitbucket gives (10 unless the platform says
# otherwise). The pull request list answers the open ones unless a state is
# named. The issue tracker's operations are not in Atlassian's published
# API description, so none is defined here.
#
# Reference: https://api.bitbucket.org/swagger.json
# Reference: https://developer.atlassian.com/cloud/bitbucket/rest/intro/
# Reference: https://support.atlassian.com/bitbucket-cloud/docs/using-api-tokens/
# Reference: https://support.atlassian.com/bitbucket-cloud/docs/api-tokens/
# Reference: https://support.atlassian.com/bitbucket-cloud/docs/api-token-permissions/
# Reference: https://support.atlassian.com/bitbucket-cloud/docs/api-request-limits/

[connector]
name = "Bitbucket"
description = "List a workspace's repositories and a repository's pull requests, read one, comment on it. Sign in with your Atlassian account email and a Bitbucket API token scoped to repositories and pull requests."
tags = ["engineering", "management"]
base_url = "https://api.bitbucket.org/2.0"
hosts = ["api.bitbucket.org"]
check = "user"
revision = 1

[connector.auth]
scheme = "basic"

[[connector.operations]]
id = "user"
name = "Current user"
description = "The signed-in user — the one call that proves the account works."
method = "get"
path = "/user"

[[connector.operations]]
id = "repositories"
name = "List repositories"
description = "The repositories of a workspace."
method = "get"
path = "/repositories/{params.workspace}"
query = { role = "{params.role}", q = "{params.q}", sort = "{params.sort}" }

[[connector.operations.params]]
name = "workspace"
label = "Workspace"
required = true
doc = "The workspace's id, as in bitbucket.org/<workspace>."

[[connector.operations.params]]
name = "role"
label = "Role"
doc = "Only the repositories you hold this role on: admin, contributor, member or owner."

[[connector.operations.params]]
name = "q"
label = "Filter"
doc = "Bitbucket's query syntax: name ~ \"api\""

[[connector.operations.params]]
name = "sort"
label = "Sort"
doc = "A field to sort by; a leading - reverses: -updated_on"

[connector.operations.output]
select = "values"

[[connector.operations]]
id = "pull_requests"
name = "List pull requests"
description = "A repository's pull requests — the open ones unless a state is named."
method = "get"
path = "/repositories/{params.workspace}/{params.repo}/pullrequests"
query = { state = "{params.state}" }

[[connector.operations.params]]
name = "workspace"
label = "Workspace"
required = true
doc = "The workspace's id."

[[connector.operations.params]]
name = "repo"
label = "Repository"
required = true
doc = "The repository's slug, as in its address."

[[connector.operations.params]]
name = "state"
label = "State"
doc = "OPEN, MERGED, DECLINED or SUPERSEDED; open when unsaid."

[connector.operations.output]
select = "values"

[[connector.operations]]
id = "pull_request"
name = "Get pull request"
description = "One pull request by its number."
method = "get"
path = "/repositories/{params.workspace}/{params.repo}/pullrequests/{params.id}"

[[connector.operations.params]]
name = "workspace"
label = "Workspace"
required = true
doc = "The workspace's id."

[[connector.operations.params]]
name = "repo"
label = "Repository"
required = true
doc = "The repository's slug."

[[connector.operations.params]]
name = "id"
label = "Number"
kind = "number"
required = true
doc = "The pull request's number."

[[connector.operations]]
id = "comment_pull_request"
name = "Comment on a pull request"
description = "Add a comment to a pull request."
method = "post"
path = "/repositories/{params.workspace}/{params.repo}/pullrequests/{params.id}/comments"
body = { kind = "json", value = { content = { raw = "{params.text}" } } }
writes = true

[[connector.operations.params]]
name = "workspace"
label = "Workspace"
required = true
doc = "The workspace's id."

[[connector.operations.params]]
name = "repo"
label = "Repository"
required = true
doc = "The repository's slug."

[[connector.operations.params]]
name = "id"
label = "Number"
kind = "number"
required = true
doc = "The pull request's number."

[[connector.operations.params]]
name = "text"
label = "Comment"
required = true
doc = "Markdown."
