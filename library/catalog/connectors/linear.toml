# Built-in connector: Linear — issues over Linear's GraphQL API.
#
# Linear reads a personal API key from the Authorization header bare —
# `Authorization: <key>`, the `Bearer` form being for OAuth tokens — so the
# scheme is an api_key in that header: paste the key as the secret. A
# GraphQL failure is an HTTP 200 whose body carries `errors`, so every
# operation expects none; a rate limit is an HTTP 400 with the code
# `RATELIMITED`. GraphQL's own braces are doubled: a definition's `{…}` is a
# placeholder.
#
# Reference: https://linear.app/developers/graphql
# Reference: https://linear.app/developers/pagination
# Reference: https://linear.app/developers/rate-limiting
# Reference: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql

[connector]
name = "Linear"
description = "List and create issues over Linear's GraphQL API. Paste a personal API key from Settings › API as the secret."
tags = ["engineering", "product"]
base_url = "https://api.linear.app"
hosts = ["api.linear.app"]
check = "viewer"
revision = 1

[connector.auth]
scheme = "api_key"
place = { in = "header", name = "Authorization" }

[[connector.operations]]
id = "viewer"
name = "Viewer"
description = "The signed-in user — the one call that proves the key works."
method = "post"
path = "/graphql"
body = { kind = "json", value = { query = "query {{ viewer {{ id name email }} }}" } }

[connector.operations.output]
select = "data.viewer"
expect = { path = "errors", absent = true, reason = "errors.0.message" }

[[connector.operations]]
id = "issues"
name = "Issues"
description = "The most recent issues, with their identifiers, titles and states."
method = "post"
path = "/graphql"
body = { kind = "json", value = { query = "query($first: Int) {{ issues(first: $first, orderBy: updatedAt) {{ nodes {{ id identifier title state {{ name }} assignee {{ name }} url }} }} }}", variables = { first = "{params.first}" } } }

[[connector.operations.params]]
name = "first"
label = "At most"
kind = "number"
required = true
doc = "How many issues, most recently updated first; Linear answers 50 unless told otherwise."

[connector.operations.output]
select = "data.issues.nodes"
expect = { path = "errors", absent = true, reason = "errors.0.message" }

[[connector.operations]]
id = "create_issue"
name = "Create issue"
description = "Create an issue in a team."
method = "post"
path = "/graphql"
body = { kind = "json", value = { query = "mutation($teamId: String!, $title: String!, $description: String) {{ issueCreate(input: {{ teamId: $teamId, title: $title, description: $description }}) {{ success issue {{ id identifier url }} }} }}", variables = { teamId = "{params.team}", title = "{params.title}", description = "{params.description}" } } }
writes = true

[[connector.operations.params]]
name = "team"
label = "Team id"
required = true
doc = "The team's id (a UUID), from the team's settings."

[[connector.operations.params]]
name = "title"
label = "Title"
required = true
doc = "The issue title, one line."

[[connector.operations.params]]
name = "description"
label = "Description"
doc = "Markdown."

[connector.operations.output]
select = "data.issueCreate"
expect = { path = "errors", absent = true, reason = "errors.0.message" }
