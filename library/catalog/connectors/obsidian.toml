# Built-in connector: Obsidian — a vault on this machine through the Local REST API plugin, read and search.
#
# The plugin serves https on 127.0.0.1:27124 with a certificate it signed
# itself, which is why this is the one connector with insecure_tls. It takes
# the key as `Authorization: Bearer <key>`, so the scheme is bearer. Its
# `GET /` answers with or without a key and says in `authenticated` whether
# the key was accepted, so the check expects that flag. A folder is listed
# under a trailing slash (`/vault/Projects/`), and a note's path keeps its
# slashes — the `path` kind. Writing a note takes a raw Markdown body, which
# this connector leaves to an agent step editing the vault's files.
#
# Reference: https://github.com/coddingtonbear/obsidian-local-rest-api
# Reference: https://coddingtonbear.github.io/obsidian-local-rest-api/

[connector]
name = "Obsidian"
description = "List, read and search the notes of an Obsidian vault on this machine through the Local REST API community plugin. Paste the plugin's API key; the plugin must be running."
tags = ["writing", "research"]
base_url = "https://127.0.0.1:27124"
hosts = ["127.0.0.1:27124"]
insecure_tls = true
check = "status"
revision = 1

[connector.auth]
scheme = "bearer"

[[connector.operations]]
id = "status"
name = "Status"
description = "The plugin's version and whether the key is accepted — the one call that proves it works."
method = "get"
path = "/"

[connector.operations.output]
expect = { path = "authenticated", equals = true }

[[connector.operations]]
id = "list_vault"
name = "List vault"
description = "The files and folders at the vault's root."
method = "get"
path = "/vault/"

[connector.operations.output]
select = "files"

[[connector.operations]]
id = "list_folder"
name = "List folder"
description = "The files and folders under a folder of the vault."
method = "get"
path = "/vault/{params.folder}/"

[[connector.operations.params]]
name = "folder"
label = "Folder"
kind = "path"
required = true
doc = "A folder path inside the vault: Projects, or Projects/2026."

[connector.operations.output]
select = "files"

[[connector.operations]]
id = "read_note"
name = "Read note"
description = "One note's Markdown by its vault path."
method = "get"
path = "/vault/{params.path}"

[[connector.operations.params]]
name = "path"
label = "Note path"
kind = "path"
required = true
doc = "Projects/Launch.md — the path inside the vault."

[[connector.operations]]
id = "search"
name = "Search"
description = "Notes whose text matches a query, with the matching lines."
method = "post"
path = "/search/simple/"
query = { query = "{params.query}", contextLength = "{params.context}" }

[[connector.operations.params]]
name = "query"
label = "Query"
required = true
doc = "Words to find in the notes text; matched case-insensitively."

[[connector.operations.params]]
name = "context"
label = "Context"
kind = "number"
doc = "How many characters of context around each match; the plugin's default is 100."
