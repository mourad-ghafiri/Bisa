# Built-in connector: SendGrid — one email sent, and the account's sending read back.
#
# An API key is sent as `Authorization: Bearer`. One message goes to one
# address a call: a `personalizations` entry with its `to`, a `from`, a
# subject and plain-text content; SendGrid answers 202, accepted. A `from`
# address that is not a verified sender is answered 403. A marketing
# contact is added or updated in a queue — the answer is a job id, not
# the contact. Template lists must name a page size, 200 at most. Calls go
# to `api.sendgrid.com`; an EU regional subuser's host, `api.eu.sendgrid.com`,
# is not this definition's.
#
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/authentication
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/responses
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/mail-send/mail-send
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/api-key-permissions/retrieve-a-list-of-scopes-for-which-this-user-has-access
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/stats/retrieve-global-email-statistics
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/bounces-api/retrieve-all-bounces
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/transactional-templates/retrieve-paged-transactional-templates
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/lists/get-all-lists
# Reference: https://www.twilio.com/docs/sendgrid/api-reference/contacts/add-or-update-a-contact

[connector]
name = "SendGrid"
description = "Send one plain-text email to one address, read sending statistics, bounces, templates and contact lists, and add or update a marketing contact. Paste an API key with the permissions for what you use."
tags = ["marketing", "ops"]
base_url = "https://api.sendgrid.com"
hosts = ["api.sendgrid.com"]
check = "scopes"
revision = 1

[connector.auth]
scheme = "bearer"

[[connector.operations]]
id = "scopes"
name = "Scopes"
description = "What the key is allowed to do — the one call that proves the key works."
method = "get"
path = "/v3/scopes"

[connector.operations.output]
select = "scopes"

[[connector.operations]]
id = "send_mail"
name = "Send mail"
description = "Send one plain-text message to one address, from a verified sender."
method = "post"
path = "/v3/mail/send"
body = { kind = "json", value = { personalizations = [{ to = [{ email = "{params.to}" }] }], from = { email = "{params.from}" }, subject = "{params.subject}", content = [{ type = "text/plain", value = "{params.body}" }] } }
writes = true

[[connector.operations.params]]
name = "to"
label = "To"
required = true
doc = "One email address."

[[connector.operations.params]]
name = "from"
label = "From"
required = true
doc = "The sender's address — one SendGrid has verified for the account."

[[connector.operations.params]]
name = "subject"
label = "Subject"
required = true
doc = "The subject line."

[[connector.operations.params]]
name = "body"
label = "Body"
required = true
doc = "The message as plain text."

[[connector.operations]]
id = "stats"
name = "Statistics"
description = "Sending statistics by day, week or month: requests, delivered, opens, clicks, bounces."
method = "get"
path = "/v3/stats"
query = { start_date = "{params.from}", end_date = "{params.to}", aggregated_by = "{params.by}" }

[[connector.operations.params]]
name = "from"
label = "From"
required = true
doc = "The first day, 2026-09-01."

[[connector.operations.params]]
name = "to"
label = "To"
doc = "The last day; empty for today."

[[connector.operations.params]]
name = "by"
label = "Grouped by"
doc = "day, week or month; empty for SendGrid's own."

[[connector.operations]]
id = "bounces"
name = "List bounces"
description = "Addresses that bounced, with the reason and the status code."
method = "get"
path = "/v3/suppression/bounces"
query = { start_time = "{params.from}", end_time = "{params.to}", limit = "{params.max}" }

[[connector.operations.params]]
name = "from"
label = "From"
kind = "number"
doc = "Bounces from this moment, in seconds since 1970; empty for no lower bound."

[[connector.operations.params]]
name = "to"
label = "To"
kind = "number"
doc = "Bounces up to this moment, in seconds since 1970; empty for no upper bound."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many bounces to return, 500 at most."

[[connector.operations]]
id = "templates"
name = "List templates"
description = "The account's transactional templates."
method = "get"
path = "/v3/templates"
query = { generations = "{params.generations}", page_size = "{params.max}" }

[[connector.operations.params]]
name = "generations"
label = "Generations"
doc = "legacy, dynamic or legacy,dynamic; SendGrid's default is legacy."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
required = true
default = 50
doc = "How many templates to return, 200 at most; 50 unless set."

[connector.operations.output]
select = "result"

[[connector.operations]]
id = "lists"
name = "List contact lists"
description = "The account's marketing contact lists, with their counts."
method = "get"
path = "/v3/marketing/lists"
query = { page_size = "{params.max}" }

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many lists to return, 1,000 at most; SendGrid's default is 100."

[connector.operations.output]
select = "result"

[[connector.operations]]
id = "upsert_contact"
name = "Add or update contact"
description = "Queue one marketing contact to be added, or updated if its address is known; the answer is a job id."
method = "put"
path = "/v3/marketing/contacts"
body = { kind = "json", value = { contacts = [{ email = "{params.email}", first_name = "{params.first_name}", last_name = "{params.last_name}" }] } }
writes = true

[[connector.operations.params]]
name = "email"
label = "Email"
required = true
doc = "The contact's address; SendGrid stores it in lower case."

[[connector.operations.params]]
name = "first_name"
label = "First name"
doc = "The contact's first name; empty to leave it."

[[connector.operations.params]]
name = "last_name"
label = "Last name"
doc = "The contact's last name; empty to leave it."
