# Built-in connector: Notion — search, pages and databases over the Notion API, as an internal integration.
#
# Pinned to `Notion-Version: 2022-06-28`, which Notion keeps serving: the
# versions from 2025-09-03 on split a database into data sources and
# address rows by a data source id, which would change the ids a person's
# steps carry. The one limit Notion names for the older version: a database
# that has gained a second data source cannot be queried or written through
# it until the step moves to the newer API.
#
# Reference: https://developers.notion.com/reference/versioning
# Reference: https://developers.notion.com/docs/upgrade-guide-2025-09-03
# Reference: https://developers.notion.com/docs/authorization
# Reference: https://developers.notion.com/reference/get-self
# Reference: https://developers.notion.com/reference/post-search
# Reference: https://developers.notion.com/reference/post-database-query
# Reference: https://developers.notion.com/reference/request-limits

[connector]
name = "Notion"
description = "Search a workspace, read and create pages, query a database. Paste an internal integration secret (ntn_…) and share the pages with the integration."
tags = ["writing", "planning"]
base_url = "https://api.notion.com"
hosts = ["api.notion.com"]
check = "me"
revision = 1

[connector.auth]
scheme = "bearer"

[[connector.operations]]
id = "me"
name = "Me"
description = "The integration's own bot user — the one call that proves the secret works."
method = "get"
path = "/v1/users/me"
headers = { "Notion-Version" = "2022-06-28" }

[[connector.operations]]
id = "search"
name = "Search"
description = "Pages and databases shared with the integration that match a query."
method = "post"
path = "/v1/search"
headers = { "Notion-Version" = "2022-06-28" }
body = { kind = "json", value = { query = "{params.query}", page_size = "{params.max}" } }

[[connector.operations.params]]
name = "query"
label = "Query"
doc = "Words in the title; empty for everything shared."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
required = true
doc = "Up to 100."

[connector.operations.output]
select = "results"

[[connector.operations]]
id = "get_page"
name = "Get page"
description = "One page's properties by id."
method = "get"
path = "/v1/pages/{params.id}"
headers = { "Notion-Version" = "2022-06-28" }

[[connector.operations.params]]
name = "id"
label = "Page id"
required = true
doc = "The 32 hex characters at the end of the page URL."

[[connector.operations]]
id = "create_page"
name = "Create page"
description = "Create a page under a page or in a database, with its properties and body blocks."
method = "post"
path = "/v1/pages"
headers = { "Notion-Version" = "2022-06-28" }
body = { kind = "json", value = { parent = "{params.parent}", properties = "{params.properties}", children = "{params.children}" } }
writes = true

[[connector.operations.params]]
name = "parent"
label = "Parent"
kind = "json"
required = true
doc = "Where the page goes: {\"page_id\": \"…\"} or {\"database_id\": \"…\"}."

[[connector.operations.params]]
name = "properties"
label = "Properties"
kind = "json"
required = true
doc = "The page's properties in Notion's shape; under a page parent, {\"title\": {\"title\": [{\"text\": {\"content\": \"…\"}}]}}."

[[connector.operations.params]]
name = "children"
label = "Blocks"
kind = "json"
required = true
doc = "A JSON array of block objects for the page's body; [] for an empty page."

[[connector.operations]]
id = "query_database"
name = "Query database"
description = "Rows of a database matching a filter — every row when no filter is given."
method = "post"
path = "/v1/databases/{params.database}/query"
headers = { "Notion-Version" = "2022-06-28" }
body = { kind = "json", value = { filter = "{params.filter}", page_size = "{params.max}" } }

[[connector.operations.params]]
name = "database"
label = "Database id"
required = true
doc = "The 32 hex characters in the database URL, before any ?v=."

[[connector.operations.params]]
name = "filter"
label = "Filter"
kind = "json"
doc = "A Notion filter object: {\"property\": \"Status\", \"select\": {\"equals\": \"Done\"}}; empty for every row."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
required = true
doc = "Up to 100."

[connector.operations.output]
select = "results"
