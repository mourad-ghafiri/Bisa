# Built-in connector: Google Drive — list, read and create files over the Drive REST API.

[connector]
name = "Google Drive"
description = "List and read files in a Drive and create new ones. Connect with your own Google OAuth client."
tags = ["content", "data"]
base_url = "https://www.googleapis.com"
hosts = ["www.googleapis.com"]
check = "about"

[connector.auth]
scheme = "oauth2"
authorization_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
scopes = ["https://www.googleapis.com/auth/drive"]
pkce = true
extra = { access_type = "offline", prompt = "consent" }

[[connector.operations]]
id = "about"
name = "About"
description = "Who the account is — the one call that proves it works."
method = "get"
path = "/drive/v3/about"
query = { fields = "user" }

[[connector.operations]]
id = "list_files"
name = "List files"
description = "Files matching a Drive query, with their ids, names and types."
method = "get"
path = "/drive/v3/files"
query = { q = "{params.q}", pageSize = "{params.max}", fields = "files(id,name,mimeType,modifiedTime,parents)" }

[[connector.operations.params]]
name = "q"
label = "Query"
doc = "A Drive search: name contains 'report' and mimeType = 'application/pdf'."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many files to return; Drive's default is 100."

[connector.operations.output]
select = "files"

[[connector.operations]]
id = "get_file"
name = "Get file"
description = "One file's metadata."
method = "get"
path = "/drive/v3/files/{params.id}"
query = { fields = "{params.fields}" }

[[connector.operations.params]]
name = "id"
label = "File id"
required = true
doc = "The file id, the long token in its Drive URL."

[[connector.operations.params]]
name = "fields"
label = "Fields"
doc = "The metadata fields to return, comma-separated; empty for Drive's default set."

[[connector.operations]]
id = "create_file"
name = "Create file"
description = "Create an empty file or a folder by name and type, under the given parents."
method = "post"
path = "/drive/v3/files"
body = { kind = "json", value = { name = "{params.name}", mimeType = "{params.mime}", parents = "{params.parents}" } }
writes = true

[[connector.operations.params]]
name = "name"
label = "Name"
required = true
doc = "The name as it will show in Drive: Q3 report."

[[connector.operations.params]]
name = "mime"
label = "MIME type"
required = true
doc = "application/vnd.google-apps.document for a Doc, application/vnd.google-apps.folder for a folder."

[[connector.operations.params]]
name = "parents"
label = "Parent folder ids"
kind = "json"
required = true
doc = "A JSON array of folder ids, [] for the root."
