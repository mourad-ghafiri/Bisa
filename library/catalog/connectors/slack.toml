# Built-in connector: Slack — post into channels and read them, as a bot, over the Slack Web API.
#
# Slack answers every failure as an HTTP 200 whose body says `"ok": false`
# with the error's name in `error` (`invalid_auth`, `channel_not_found`), so
# every operation expects `ok` to be true. Apps distributed outside the Slack
# Marketplace have read `conversations.history` under a stricter limit since
# May 2025 (one request a minute, 15 messages at most); an internal app has
# the full tier.
#
# Reference: https://docs.slack.dev/apis/web-api/
# Reference: https://docs.slack.dev/reference/methods/auth.test
# Reference: https://docs.slack.dev/reference/methods/chat.postMessage
# Reference: https://docs.slack.dev/reference/methods/conversations.list
# Reference: https://docs.slack.dev/reference/methods/conversations.history
# Reference: https://docs.slack.dev/apis/web-api/rate-limits

[connector]
name = "Slack"
description = "Post messages and read channels as a Slack app's bot. Paste the bot token (xoxb-…) from your app's OAuth page; the app needs chat:write, channels:read and channels:history."
tags = ["ops", "management"]
base_url = "https://slack.com"
hosts = ["slack.com"]
check = "auth_test"
revision = 1

[connector.auth]
scheme = "bearer"

[[connector.operations]]
id = "auth_test"
name = "Who am I"
description = "The bot's own identity and workspace — the one call that proves the token works."
method = "post"
path = "/api/auth.test"

[connector.operations.output]
expect = { path = "ok", equals = true, reason = "error" }

[[connector.operations]]
id = "post_message"
name = "Post message"
description = "Post a message into a channel the bot is in."
method = "post"
path = "/api/chat.postMessage"
body = { kind = "json", value = { channel = "{params.channel}", text = "{params.text}" } }
writes = true

[[connector.operations.params]]
name = "channel"
label = "Channel"
required = true
doc = "A channel id (C0123…) or a #name."

[[connector.operations.params]]
name = "text"
label = "Text"
required = true
doc = "The message, in Slack's mrkdwn."

[connector.operations.output]
expect = { path = "ok", equals = true, reason = "error" }

[[connector.operations]]
id = "list_channels"
name = "List channels"
description = "The channels the bot can see."
method = "get"
path = "/api/conversations.list"
query = { limit = "{params.max}", types = "{params.types}", exclude_archived = "true" }

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many to return; Slack answers 100 unless told otherwise, at most 999."

[[connector.operations.params]]
name = "types"
label = "Types"
doc = "public_channel, private_channel, or both comma-separated; empty for public."

[connector.operations.output]
select = "channels"
expect = { path = "ok", equals = true, reason = "error" }

[[connector.operations]]
id = "channel_history"
name = "Channel history"
description = "The latest messages in a channel, newest first."
method = "get"
path = "/api/conversations.history"
query = { channel = "{params.channel}", limit = "{params.max}" }

[[connector.operations.params]]
name = "channel"
label = "Channel id"
required = true
doc = "A channel id (C0123...); this call does not take a #name."

[[connector.operations.params]]
name = "max"
label = "At most"
kind = "number"
doc = "How many to return; Slack answers 100 unless told otherwise, at most 999 — 15 for an app distributed outside the Slack Marketplace."

[connector.operations.output]
select = "messages"
expect = { path = "ok", equals = true, reason = "error" }
