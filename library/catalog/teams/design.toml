# Built-in team: Design — a committed outcome becomes flows, states and screens judged on the real page.

[team]
name = "Design"
purpose = "Turns a committed outcome into task flows, screen states and the words in them, so someone can build against it, then judges what was built on the real page — in the embedded browser, at a phone's width and a desk's, light and dark. Happy path, empty, error and loading, before pixels and after them."
tags = ["design", "product"]
agents = ["ux-designer", "product-manager", "content-strategist", "document-humanizer"]
